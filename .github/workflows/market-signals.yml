name: NIFTY Sector Rotation and Polymarket Event Odds
on:
  schedule:
    - cron: "30 1 * * *"
    - cron: "30 13 * * *"
  workflow_dispatch: {}
  push:
    paths:
      - ".github/workflows/market-signals.yml"
      - "scripts/sector_rotation.py"
      - "scripts/polymarket_monitor.py"
permissions:
  contents: write
concurrency:
  group: equity-atlas-market-signals
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect 3-month NSE index price history and calculate relative rotation
        id: nse
        continue-on-error: true
        run: python scripts/sector_rotation.py
      - name: Collect Polymarket public macro probabilities
        id: polymarket
        continue-on-error: true
        run: python scripts/polymarket_monitor.py
      - name: Archive successful signals with source status
        run: |
          mkdir -p data/market-signals
          git config user.name "equity-atlas-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/market-signals
          if ! git diff --cached --quiet; then
            git commit -m "signals: update NSE sector momentum and Polymarket macro-event odds"
            git pull --rebase origin "${GITHUB_REF_NAME:-main}"
            git push origin "HEAD:${GITHUB_REF_NAME:-main}"
          fi
      - name: Report source availability
        if: steps.nse.outcome != 'success' && steps.polymarket.outcome != 'success'
        run: |
          echo "Both independent market signal collectors failed" >&2
          exit 1
